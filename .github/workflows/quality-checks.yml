name: Quality Checks

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-secret-key-for-github-actions-32chars
      CRON_SECRET: ci-cron-secret-key-for-github-actions-32
      RUSHPLAY_SKIP_DB_INIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests (SQLite en mémoire)
        run: python -m pytest -q

      - name: Vocabulaire interdit
        run: |
          if grep -rniE "value_bet|value_percent|confidence_score|recommended_bet|prediction" app/ tests/ ../README.md .env.example; then
            echo "Vocabulaire interdit détecté" && exit 1
          fi
          echo "OK"

  migrations-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-secret-key-for-github-actions-32chars
      CRON_SECRET: ci-cron-secret-key-for-github-actions-32
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Sur une base neuve : la migration doit passer d'un bout à l'autre.
      - name: Migrations sur PostgreSQL neuf
        run: alembic upgrade head

      # Et redescendre proprement, pour que les downgrade ne pourrissent pas avec le temps.
      - name: Retour arrière complet
        run: alembic downgrade base

      - name: Remontée après retour arrière
        run: alembic upgrade head

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Vocabulaire interdit
        run: |
          # Les trois sorties de grep sont distinguées explicitement : 0 = vocabulaire trouvé (échec),
          # 1 = rien trouvé (succès), 2 = grep lui-même en erreur (motif invalide, chemin absent...).
          # Un simple `if grep ...` confondrait 1 et 2 et laisserait passer un grep cassé.
          set +e
          grep -rniE "prédiction|pronostic|value bet|confiance|prediction|confidence" app components lib
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "Vocabulaire interdit détecté"; exit 1; fi
          if [ "$code" -ne 1 ]; then echo "grep en erreur (code $code)"; exit "$code"; fi
          echo "OK"
