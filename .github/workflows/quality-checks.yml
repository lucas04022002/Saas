name: Quality Checks

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-secret-key-for-github-actions-32chars
      CRON_SECRET: ci-cron-secret-key-for-github-actions-32
      RUSHPLAY_SKIP_DB_INIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests (SQLite en mémoire)
        run: python -m pytest -q

      - name: Vocabulaire interdit
        run: |
          if grep -rniE "value_bet|value_percent|confidence_score|recommended_bet|prediction" app/ tests/ ../README.md .env.example; then
            echo "Vocabulaire interdit détecté" && exit 1
          fi
          echo "OK"

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
